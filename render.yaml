services:
  - type: web
    name: custom-zmk-studio
    runtime: static
    branch: main
    buildCommand: >-
      rm -rf ../zmk-studio-ts-client &&
      git clone --depth 1 --branch main
      https://github.com/Sukumar002/zmk-studio-ts-client.git
      ../zmk-studio-ts-client &&
      (cd ../zmk-studio-ts-client && npm ci --ignore-scripts && npm run build) &&
      npm ci &&
      npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: SKIP_PROTO_GEN
        value: "1"

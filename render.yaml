services:
  - type: web
    name: custom-zmk-studio
    runtime: static
    branch: main
    buildCommand: >-
      apt-get update &&
      apt-get install -y protobuf-compiler &&
      rm -rf ../zmk-studio-ts-client &&
      git clone --depth 1 --branch main
      https://github.com/Sukumar002/zmk-studio-ts-client.git
      ../zmk-studio-ts-client &&
      (cd ../zmk-studio-ts-client && npm install) &&
      npm ci &&
      npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: "true"

services:
  - type: web
    name: custom-zmk-studio
    runtime: static
    branch: main
    buildCommand: >-
      rm -rf /tmp/protoc /tmp/protoc.zip ../zmk-studio-ts-client &&
      curl -L -o /tmp/protoc.zip
      https://github.com/protocolbuffers/protobuf/releases/download/v28.3/protoc-28.3-linux-x86_64.zip &&
      python -c "import zipfile; zipfile.ZipFile('/tmp/protoc.zip').extractall('/tmp/protoc')" &&
      export PATH="/tmp/protoc/bin:$PATH" &&
      git clone --depth 1 --branch main
      https://github.com/Sukumar002/zmk-studio-ts-client.git
      ../zmk-studio-ts-client &&
      (cd ../zmk-studio-ts-client && npm ci && npm run build) &&
      npm ci &&
      npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: "true"

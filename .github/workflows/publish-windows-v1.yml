name: "Publish ZMK Studio Custom v1"

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-windows-v1.yml"
      - "src-tauri/tauri.conf.json"

jobs:
  publish-v1:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Check whether v1 is already published
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view v1.0.0 --repo "$env:GITHUB_REPOSITORY" *> $null
          $exists = ($LASTEXITCODE -eq 0)
          $global:LASTEXITCODE = 0
          if ($exists) {
            "exists=true" >> $env:GITHUB_OUTPUT
          } else {
            "exists=false" >> $env:GITHUB_OUTPUT
          }
          exit 0

      - name: Checkout Studio
        if: steps.release.outputs.exists != 'true'
        uses: actions/checkout@v4
        with:
          path: zmk-studio

      - name: Checkout Studio TypeScript client
        if: steps.release.outputs.exists != 'true'
        uses: actions/checkout@v4
        with:
          repository: Sukumar002/zmk-studio-ts-client
          ref: main
          submodules: recursive
          path: zmk-studio-ts-client

      - name: Install protoc
        if: steps.release.outputs.exists != 'true'
        run: choco install protoc -y

      - name: Set up Node
        if: steps.release.outputs.exists != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: |
            zmk-studio/package-lock.json
            zmk-studio-ts-client/package-lock.json

      - name: Set up Rust
        if: steps.release.outputs.exists != 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        if: steps.release.outputs.exists != 'true'
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./zmk-studio/src-tauri -> target"

      - name: Build Studio TypeScript client
        if: steps.release.outputs.exists != 'true'
        working-directory: zmk-studio-ts-client
        run: npm install

      - name: Install Studio dependencies
        if: steps.release.outputs.exists != 'true'
        working-directory: zmk-studio
        run: npm ci

      - name: Configure unsigned standalone build
        if: steps.release.outputs.exists != 'true'
        working-directory: zmk-studio/src-tauri
        shell: bash
        run: |
          node -e "const fs=require('fs'),f='tauri.conf.json',c=JSON.parse(fs.readFileSync(f,'utf8'));delete c.bundle.windows.signCommand;c.bundle.createUpdaterArtifacts=false;fs.writeFileSync(f,JSON.stringify(c,null,2)+'\\n')"

      - name: Build Windows installers
        if: steps.release.outputs.exists != 'true'
        working-directory: zmk-studio
        run: npm run tauri build -- --bundles nsis,msi

      - name: Write release notes
        if: steps.release.outputs.exists != 'true'
        shell: pwsh
        run: |
          @(
            "# ZMK Studio Custom v1",
            "",
            "> A personal, community-built ZMK Studio fork focused on practical day-to-day configuration of split keyboards: richer combo management, custom behaviors, clearer key legends, backup/restore, and a standalone Windows desktop build.",
            "",
            "## Use it on the web",
            "",
            "**No installation required:** https://custom-zmk-studio.onrender.com/",
            "",
            "The hosted web build provides the same custom Studio UI and feature set. A Chromium-based browser with Web Serial support is recommended for USB connections.",
            "",
            "## Highlights",
            "",
            "- Runtime combo viewing, creation, editing and removal",
            "- Combo naming, grouping, ordering and layer masks",
            "- Physical-key previews and key-position selection for combos",
            "- Advanced combo settings with clearer controls and help text",
            "- Custom behavior support with metadata-aware parameter editing",
            "- Layout-shift-aware key press and mod-tap behaviors",
            "- Backup/export and restore/import of supported runtime configuration, including combos and custom behaviors",
            "- Improved layer, mod-tap and layer-tap rendering",
            "- Custom legends for Bluetooth, OLED, timeout, OS/layout-shift and mouse controls",
            "- Mouse move, scroll and button legends including LMB/MMB/RMB/MB4/MB5",
            "- Native Windows desktop application with USB/serial transport",
            "",
            "## Credits and upstream work",
            "",
            "This project is a derivative of the official **ZMK Studio** project maintained by the ZMK project and its contributors:",
            "",
            "- https://github.com/zmkfirmware/zmk-studio",
            "- https://github.com/zmkfirmware/zmk-studio-ts-client",
            "- https://github.com/zmkfirmware/zmk-studio-messages",
            "- https://github.com/zmkfirmware/zmk",
            "",
            "Special thanks to **Daniel Svane (@danielsvane)**. This fork was based directly on Daniel's Studio, TypeScript client and protocol-message forks. His custom-keyboard work provided the combo/custom-behavior foundation that this project further extends:",
            "",
            "- https://github.com/danielsvane/zmk-studio",
            "- https://github.com/danielsvane/zmk-studio-ts-client",
            "- https://github.com/danielsvane/zmk-studio-messages",
            "",
            "The original Studio project and these derivative works are distributed under the upstream project's Apache-2.0 licensing terms.",
            "",
            "## Why this fork exists",
            "",
            "This project was built purely as a personal project to improve the functionality and day-to-day usability of my own ZMK split keyboards. The goal is not to replace official ZMK Studio, but to make experimentation with compact layouts, combos and custom behaviors easier without rebuilding firmware for every small change.",
            "",
            "The features have primarily been developed and tested around my own keyboard firmware and workflow, so compatibility with every ZMK keyboard or custom firmware configuration is not guaranteed.",
            "",
            "## Important disclaimer",
            "",
            "**ZMK Studio Custom is an independent, unofficial personal fork. It is not an official ZMK release and is not affiliated with, endorsed by, or supported by the ZMK project, its maintainers, or Daniel Svane.**",
            "",
            "The Windows installers in this release are **unsigned**. The desktop-build setup inherited from Daniel's fork explicitly notes that, without Azure Trusted Signing credentials, the Windows MSI/EXE packages ship unsigned. Windows SmartScreen may therefore display an **Unknown Publisher** or similar warning.",
            "",
            "Updater signing and operating-system code signing are separate mechanisms. An updater signature proves that an update came from the expected release source; it does not make an installer trusted by Windows. This v1 release should be treated as a manually installed standalone build unless a signed update channel is explicitly provided later.",
            "",
            "Use the software at your own discretion. It is provided as-is, without any guarantee of compatibility with every keyboard, firmware build, operating system, browser, or future ZMK Studio protocol revision.",
            "",
            "For official firmware, Studio releases, documentation and support, please use the upstream ZMK project.",
            "",
            "## Windows downloads",
            "",
            "- **EXE installer** — recommended for normal Windows installation",
            "- **MSI installer** — useful for managed or deployment-oriented installations",
            "",
            "Both installers contain the same ZMK Studio Custom v1 application."
          ) | Set-Content release-notes.md
      - name: Publish ZMK Studio Custom v1
        if: steps.release.outputs.exists != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $exe = Get-ChildItem "zmk-studio/src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          $msi = Get-ChildItem "zmk-studio/src-tauri/target/release/bundle/msi/*.msi" | Select-Object -First 1
          if (-not $exe -or -not $msi) { throw "Windows installer assets were not produced." }
          gh release create v1.0.0 --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "ZMK Studio Custom v1" --notes-file release-notes.md "$($exe.FullName)" "$($msi.FullName)"

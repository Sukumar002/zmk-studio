name: "Publish ZMK Studio Custom v1.0.1"

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/attach-v1-platform-assets.yml"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 39059835299
          name: zmk-studio-windows
          path: artifacts/windows

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 39059835299
          name: zmk-studio-macos
          path: artifacts/macos

      - name: Download Linux AMD64 artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 39059835299
          name: zmk-studio-linux
          path: artifacts/linux-amd64

      - name: Download Linux ARM64 artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 39059835299
          name: zmk-studio-linux-arm64
          path: artifacts/linux-arm64

      - name: Verify release version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$version" != "1.0.1" ]; then
            echo "::error::expected package version 1.0.1, got $version"
            exit 1
          fi

      - name: Create v1.0.1 release and attach installers
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v1.0.1"

          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "ZMK Studio Custom v1.0.1" \
              --notes-file release-notes/v1.0.1.md
          fi

          mapfile -d '' installers < <(find artifacts -type f \
            \( -name '*.deb' -o -name '*.AppImage' -o -name '*.dmg' \
               -o -name '*.msi' -o -name '*.exe' \) -print0)

          if [ ${#installers[@]} -eq 0 ]; then
            echo "::error::no installers found in validated v1.0.1 artifacts"
            exit 1
          fi

          printf 'publishing %s\n' "${installers[@]}"
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber "${installers[@]}"

      - name: Show published release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view v1.0.1 --repo "$GITHUB_REPOSITORY" \
            --json tagName,name,targetCommitish,url,assets

on:
  workflow_dispatch:

permissions: {}

name: release-please

# Release PR automation is opt-in. Normal development pushes only build/deploy
# the web app; this avoids a known PR-permission failure on every commit.

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # Required, not optional: the action defaults this to the repository's
          # default branch, which is still upstream's `main` — 138 commits behind
          # the branch we ship from. Without it the release PR would target a
          # branch nothing is built or deployed off.
          target-branch: main
          # GITHUB_TOKEN suffices because nothing downstream waits on the release
          # event. A release created with it raises no `release: published`, so
          # tauri-build attaches the installers from this same push instead — see
          # publish-latest in tauri-build.yml.
          token: ${{ secrets.GITHUB_TOKEN }}

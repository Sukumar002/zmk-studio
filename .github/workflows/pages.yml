name: Deploy GitHub Pages

on:
  push:
    branches:
      - hana-combo-names
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Studio
        uses: actions/checkout@v4
        with:
          path: zmk-studio

      - name: Checkout owned Studio client
        uses: actions/checkout@v4
        with:
          repository: Sukumar002/zmk-studio-ts-client
          ref: hana-combo-names
          submodules: recursive
          path: zmk-studio-ts-client

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: |
            zmk-studio/package-lock.json
            zmk-studio-ts-client/package-lock.json

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Build owned Studio client
        working-directory: zmk-studio-ts-client
        run: npm install

      - name: Install Studio dependencies
        working-directory: zmk-studio
        run: npm ci

      - name: Build Studio for GitHub Pages
        working-directory: zmk-studio
        env:
          VITE_BASE: /zmk-studio/
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: zmk-studio/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
